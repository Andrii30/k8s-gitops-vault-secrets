name: validate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install yamllint
      - run: yamllint -c .yamllint.yaml .

  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kc.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /usr/local/bin kubeconform
      - name: Validate manifests
        run: |
          files=$(find argocd secrets manifests -type f \( -name '*.yaml' -o -name '*.yml' \) 2>/dev/null || true)
          if [ -z "$files" ]; then echo "no manifests yet — skipping"; exit 0; fi
          echo "$files" | xargs kubeconform -strict -ignore-missing-schemas -summary

  kube-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stackrox/kube-linter-action@v1
        with:
          directory: .
          config: .kube-linter.yaml
