# Reads secret/gitea/admin from Vault (kv-v2) and writes it into a native
# k8s Secret named gitea-admin, refreshed every 30s.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gitea-admin
  namespace: gitops-vault-secrets
spec:
  vaultAuthRef: gitea
  mount: secret
  type: kv-v2
  path: gitea/admin
  refreshAfter: 30s
  destination:
    name: gitea-admin
    create: true
