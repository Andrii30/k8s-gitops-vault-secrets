# How VSO authenticates: it mints a projected token for the vault-auth
# ServiceAccount and presents it to Vault's kubernetes auth method under
# role "gitea". Audience must match the role (audience=vault).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: gitea
  namespace: gitops-vault-secrets
spec:
  vaultConnectionRef: vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: gitea
    serviceAccount: vault-auth
    audiences:
      - vault
