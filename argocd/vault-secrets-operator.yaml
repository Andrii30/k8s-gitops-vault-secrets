apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault-secrets-operator
    targetRevision: "1.5.1"
    helm:
      valuesObject:
        # We keep VaultConnection / VaultAuth as CRs in git (manifests/),
        # not baked into the operator's values.
        defaultVaultConnection:
          enabled: false
        # Chart ships sane default resources for both containers; no override.
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-secrets-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # VSO bundles large CRDs; server-side apply avoids the
      # "metadata.annotations: Too long" client-side apply limit.
      - ServerSideApply=true
