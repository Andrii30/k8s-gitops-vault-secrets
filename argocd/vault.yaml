apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: "0.34.1"
    helm:
      valuesObject:
        server:
          # dev mode: in-memory storage, auto-unsealed, known root token.
          # ponytail: fine for learning VSO; for anything real use HA +
          # persistent storage + proper unseal.
          dev:
            enabled: true
            devRootToken: "root"
          resources:
            # Vault 1.20 (image 2.0.4) dev-mode RSS sits ~300Mi at rest;
            # 256Mi got the process OOMKilled (exit 137) in a restart loop,
            # which also starved the readiness probe (vault status timeouts).
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
        injector:
          enabled: false      # we use Vault Secrets Operator, not the agent injector
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
