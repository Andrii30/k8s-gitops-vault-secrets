# GitOps-managed: this Application watches the repo's manifests/ dir, so
# future CR changes sync automatically (unlike the Helm-chart Applications).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Andrii30/k8s-gitops-vault-secrets.git
    targetRevision: main
    path: manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-vault-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
